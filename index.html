<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D Web Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #canvas {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- PixiJS (描画ライブラリ) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.9/browser/pixi.min.js"></script>
  
  <!-- Live2D Cubism Core (公式コアライブラリ) -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  
  <!-- pixi-live2d-display (Live2Dを簡単につなぐライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
</head>
<body>

  <!-- Live2Dを表示するキャンバス -->
  <canvas id="canvas"></canvas>

  <script>
    const { Application, live2d } = PIXI;
    const { Live2DModel } = live2d;

    (async function () {
      // 1. PixiJS アプリケーションの作成
      const app = new Application({
        view: document.getElementById('canvas'),
        autoStart: true,
        resizeTo: window,
        transparent: true
      });

      // 2. Live2Dモデルのロード (高品質なサンプルモデル: Mao)
      // 他のモデルに変更したい場合は、この.model3.jsonのURLを差し替えてください
      const modelUrl = 'https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display/test/assets/mao/mao.model3.json';

      const model = await Live2DModel.from(modelUrl);

      // 3. 画面に追加
      app.stage.addChild(model);

      // 4. モデルの配置とスケール（サイズ）設定
      model.anchor.set(0.5, 0.5); // 中央合わせ
      model.x = window.innerWidth / 2;
      model.y = window.innerHeight / 2 + 100; // 少し下寄りに配置
      model.scale.set(0.25); // 拡大・縮小率

      // 5. インタラクション設定（マウス・カーソル追従）
      // これにより、顔の向きや目線がカーソルを追いかけ、物理演算も自動適用されます
      model.on('hit', (hitAreas) => {
        if (hitAreas.includes('Body')) {
          model.motion('tap_body');
        }
      });

      // ウィンドウサイズが変更されたときに位置を調整
      window.addEventListener('resize', () => {
        model.x = window.innerWidth / 2;
        model.y = window.innerHeight / 2 + 100;
      });
    })();
  </script>
</body>
</html>
