<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D Camera Tracking Demo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    #canvas {
      width: 100%;
      height: 100%;
    }
    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,0.8);
      padding: 12px 20px;
      border-radius: 8px;
      z-index: 100;
      max-width: 80%;
      word-break: break-all;
    }
    #webcam {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 160px;
      height: 120px;
      border: 2px solid #555;
      border-radius: 6px;
      transform: scaleX(-1);
      z-index: 10;
    }
  </style>

  <!-- PixiJS v6 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.9/browser/pixi.min.js"></script>
  <!-- Live2D Cubism Core -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <!-- pixi-live2d-display -->
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js"></script>
  <!-- MediaPipe Face Landmarker -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="status">初期化中...</div>
  <canvas id="canvas"></canvas>
  <video id="webcam" autoplay playsinline muted></video>

  <script>
    window.PIXI = PIXI;
    const { Application } = PIXI;
    const { Live2DModel } = PIXI.live2d;

    let model = null;
    let faceLandmarker = null;
    let lastVideoTime = -1;
    const statusEl = document.getElementById('status');

    function updateStatus(msg) {
      console.log(msg);
      statusEl.innerText = msg;
    }

    async function init() {
      try {
        // 1. PixiJS セットアップ
        updateStatus('1/4: キャンバスを準備中...');
        const app = new Application({
          view: document.getElementById('canvas'),
          autoStart: true,
          resizeTo: window,
          transparent: true
        });

        // 2. Live2D モデルロード (安定性の高い公式HiyoriモデルURL)
        updateStatus('2/4: 3Dモデルをダウンロード中...');
        const modelUrl = 'https://raw.githubusercontent.com/pixijs/pixi-live2d-display/master/test/assets/hiyori/hiyori.model3.json';

        model = await Live2DModel.from(modelUrl, { autoInteract: false });
        app.stage.addChild(model);

        // モデルの配置・スケール調整
        model.anchor.set(0.5, 0.5);
        model.x = window.innerWidth / 2;
        model.y = window.innerHeight / 2 + 100;
        model.scale.set(0.2);

        window.addEventListener('resize', () => {
          model.x = window.innerWidth / 2;
          model.y = window.innerHeight / 2 + 100;
        });

        // 3. MediaPipe (カメラ顔認識) セットアップ
        updateStatus('3/4: 顔認識AIモデルを読み込み中...');
        const vision = await window.FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
        );

        faceLandmarker = await window.FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: 'GPU'
          },
          runningMode: 'VIDEO',
          numFaces: 1
        });

        // 4. カメラ起動
        updateStatus('4/4: カメラへのアクセスをリクエスト中...');
        const video = document.getElementById('webcam');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        
        video.addEventListener('loadeddata', () => {
          updateStatus('準備完了！カメラに向かって顔を動かしてください。');
          setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
          predictWebcam(video);
        });

      } catch (err) {
        updateStatus('エラーが発生しました: ' + err.message);
        console.error(err);
      }
    }

    async function predictWebcam(video) {
      if (lastVideoTime !== video.currentTime && faceLandmarker) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.faceLandmarks && results.faceLandmarks.length > 0 && model) {
          const landmarks = results.faceLandmarks[0];

          const nose = landmarks[1];
          const leftEye = landmarks[33];
          const rightEye = landmarks[263];

          // 向き計算
          const yaw = (nose.x - 0.5) * -80;
          const pitch = (nose.y - 0.5) * -80;
          const roll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x) * (180 / Math.PI);

          // 口の開閉
          const topLip = landmarks[13];
          const bottomLip = landmarks[14];
          const mouthDistance = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);
          const mouthOpen = Math.min(Math.max((mouthDistance - 0.015) * 12, 0), 1);

          // Live2D パラメータへ割り当て
          const core = model.internalModel.coreModel;
          core.setParameterValueById('ParamAngleX', yaw);
          core.setParameterValueById('ParamAngleY', pitch);
          core.setParameterValueById('ParamAngleZ', roll);
          core.setParameterValueById('ParamBodyAngleX', yaw * 0.4);
          core.setParameterValueById('ParamMouthOpenY', mouthOpen);
          core.setParameterValueById('ParamEyeBallX', yaw / 30);
          core.setParameterValueById('ParamEyeBallY', pitch / 30);
        }
      }
      requestAnimationFrame(() => predictWebcam(video));
    }

    init();
  </script>
</body>
</html>
